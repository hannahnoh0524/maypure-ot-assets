<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#f3f6fb">
  <title>메이퓨어 OT 로그인</title>
  <link rel="apple-touch-icon" href="Maypure_OT_apple_touch_icon_180.png">
  <link rel="icon" type="image/png" sizes="512x512" href="Maypure_OT_icon_512.png">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:#f3f6fb; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif; color:#172033; }
    .wrap { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
    .card { width:min(460px,100%); background:#fff; border:1px solid #e2e8f0; border-radius:20px; padding:30px 26px; box-shadow:0 12px 34px rgba(15,23,42,.08); text-align:center; }
    .logo { width:92px; height:92px; border-radius:22px; margin:0 auto 18px; display:block; }
    h1 { margin:0 0 10px; font-size:27px; line-height:1.3; }
    p { margin:0; color:#64748b; font-size:14px; line-height:1.65; }
    #googleButton { display:flex; justify-content:center; margin-top:24px; min-height:44px; }
    #status { min-height:22px; margin-top:16px; font-size:13px; color:#64748b; }
    .notice { margin-top:18px; padding:12px 14px; border-radius:12px; background:#f8fafc; border:1px solid #e2e8f0; text-align:left; font-size:12px; color:#64748b; line-height:1.6; }
    .fallback { display:none; margin-top:14px; color:#1f6fe5; font-weight:700; text-decoration:none; }
  </style>
</head>
<body>
  <div class="wrap">
    <main class="card">
      <img class="logo" src="Maypure_OT_icon_512.png" alt="Maypure OT">
      <h1>메이퓨어 오버타임</h1>
      <p>전 직원 연락처에 등록된 본인의 Google 계정을 선택해 주세요.</p>
      <div id="googleButton"></div>
      <div id="status">Google 로그인 준비 중...</div>
      <a id="fallback" class="fallback" href="https://script.google.com/macros/s/AKfycbxWJOasJQUboo7d_zhiT_0PSxlu2VtBYjcCfLTWwer6shYmHcm1aIpMrm-LiFpf6Rs/exec">메이퓨어 OT로 돌아가기</a>
      <div class="notice">카카오톡·네이버 등 앱 내부 브라우저에서는 Google 로그인이 제한될 수 있습니다. Safari, Chrome, Edge 등 일반 브라우저 사용을 권장합니다.</div>
    </main>
  </div>
  <script>
    const CLIENT_ID = "969003849790-pimrgpstt5ep5js5qrlheh9ej7od4lvu.apps.googleusercontent.com";
    const APP_URL = "https://script.google.com/macros/s/AKfycbxWJOasJQUboo7d_zhiT_0PSxlu2VtBYjcCfLTWwer6shYmHcm1aIpMrm-LiFpf6Rs/exec";

    function setStatus(message) {
      const el = document.getElementById('status');
      if (el) el.textContent = message || '';
    }

    function showFallback() {
      const el = document.getElementById('fallback');
      if (el) el.style.display = 'inline-block';
    }

    function handleCredentialResponse(response) {
      const credential = response && response.credential ? response.credential : '';

      if (!credential) {
        setStatus('Google 계정 정보를 받지 못했습니다. 다시 시도해 주세요.');
        showFallback();
        return;
      }

      setStatus('메이퓨어 계정을 확인하는 중입니다...');

      const form = document.createElement('form');
      form.method = 'POST';
      form.action = APP_URL;
      form.style.display = 'none';

      const source = document.createElement('input');
      source.type = 'hidden';
      source.name = 'loginSource';
      source.value = 'google-gis';
      form.appendChild(source);

      const token = document.createElement('input');
      token.type = 'hidden';
      token.name = 'googleCredential';
      token.value = credential;
      form.appendChild(token);

      document.body.appendChild(form);
      form.submit();
    }

    function initGoogleSignIn() {
      if (!window.google || !google.accounts || !google.accounts.id) {
        setStatus('Google 로그인 모듈을 불러오지 못했습니다. 새로고침해 주세요.');
        showFallback();
        return;
      }

      google.accounts.id.initialize({
        client_id: CLIENT_ID,
        callback: handleCredentialResponse,
        auto_select: false,
        cancel_on_tap_outside: true
      });

      google.accounts.id.renderButton(
        document.getElementById('googleButton'),
        {
          type: 'standard',
          theme: 'outline',
          size: 'large',
          text: 'signin_with',
          shape: 'rectangular',
          logo_alignment: 'left',
          width: 320
        }
      );

      setStatus('');
    }

    window.addEventListener('load', () => {
      let tries = 0;
      const timer = setInterval(() => {
        tries++;
        if (window.google && google.accounts && google.accounts.id) {
          clearInterval(timer);
          initGoogleSignIn();
          return;
        }
        if (tries >= 40) {
          clearInterval(timer);
          setStatus('Google 로그인 모듈을 불러오지 못했습니다. 네트워크를 확인해 주세요.');
          showFallback();
        }
      }, 100);
    });
  </script>
</body>
</html>
