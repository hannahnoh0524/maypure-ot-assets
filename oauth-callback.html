<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>메이퓨어 OT 로그인 처리</title>
  <style>
    body {
      margin: 0;
      background: #f3f6fb;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      color: #172033;
    }
    .wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
    }
    .card {
      width: min(460px, 100%);
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 18px;
      padding: 28px;
      box-sizing: border-box;
      text-align: center;
    }
    h2 { margin: 0 0 10px; font-size: 22px; }
    p { margin: 0; color: #64748b; line-height: 1.6; }
    a {
      display: inline-flex;
      margin-top: 18px;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 18px;
      border-radius: 12px;
      background: #1f6fe5;
      color: #fff;
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h2>Google 로그인 처리 중</h2>
      <p id="msg">잠시만 기다려 주세요.</p>
      <a id="fallback" href="https://script.google.com/macros/s/AKfycbxWJOasJQUboo7d_zhiT_0PSxlu2VtBYjcCfLTWwer6shYmHcm1aIpMrm-LiFpf6Rs/exec" style="display:none">메이퓨어 오버타임으로 돌아가기</a>
    </div>
  </div>

  <script>
    (function () {
      var APP_URL = "https://script.google.com/macros/s/AKfycbxWJOasJQUboo7d_zhiT_0PSxlu2VtBYjcCfLTWwer6shYmHcm1aIpMrm-LiFpf6Rs/exec";
      var params = new URLSearchParams(window.location.search);

      var code = params.get('code') || '';
      var state = params.get('state') || '';
      var error = params.get('error') || '';
      var errorDescription = params.get('error_description') || '';

      if (!state || (!code && !error)) {
        document.getElementById('msg').textContent =
          '로그인 응답 정보가 올바르지 않습니다. 메이퓨어 오버타임에서 다시 로그인해 주세요.';
        document.getElementById('fallback').style.display = 'inline-flex';
        return;
      }

      var target = new URL(APP_URL);
      target.searchParams.set('oauthCallback', '1');
      target.searchParams.set('state', state);

      if (code) {
        target.searchParams.set('code', code);
      }

      if (error) {
        target.searchParams.set('error', error);
      }

      if (errorDescription) {
        target.searchParams.set('error_description', errorDescription);
      }

      // 현재 callback URL을 브라우저 기록에 남기지 않고 공식 앱으로 이동.
      window.location.replace(target.toString());
    })();
  </script>
</body>
</html>
